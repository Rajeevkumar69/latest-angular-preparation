<div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center">
     <div class="row w-100 justify-content-center">
          <div class="col-12 col-sm-10 col-md-6 col-lg-4 col-xl-3">
               <div class="card border-0 shadow-md rounded-4 p-4">
                    <div class="text-center mb-4">
                         <h5 class="mb-1">Welcome Back</h5>
                         <p class="small mb-0">Login to your account</p>
                    </div>

                    <form [formGroup]="loginForm" (ngSubmit)="submit()">
                         <div class="mb-3">
                              <label for="email" class="form-label fw-medium">Email</label>
                              <input id="email" type="email" class="form-control" placeholder="admin@gmail.com"
                                   formControlName="email" (blur)="displaySingleFormError(loginForm)" />
                              <pre class="text-danger fnt-12 fst-italic fw-bold"
                                   *ngIf="formErrors.email">{{ formErrors.email }}</pre>
                         </div>

                         <div class="mb-4">
                              <label for="password" class="form-label fw-medium">Password</label>
                              <input id="password" type="password" class="form-control" placeholder="Password"
                                   formControlName="password" (blur)="displaySingleFormError(loginForm)" />
                              <pre class="text-danger fnt-12 fst-italic fw-bold"
                                   *ngIf="formErrors.password">{{ formErrors.password }}</pre>
                         </div>

                         <div class="d-grid">
                              <button matButton="filled" mat-raised-button type="submit" class="py-2">
                                   Login
                              </button>
                         </div>
                    </form>
               </div>
          </div>
     </div>
</div>
